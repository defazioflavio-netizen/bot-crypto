name: Bot crypto

on:
  schedule:
    - cron: "*/5 * * * *"    # ogni 5 minuti (il minimo che GitHub permette)
  workflow_dispatch:
    inputs:
      solo_test:
        description: "Solo test connessione (nessun ordine)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: bot-crypto
  cancel-in-progress: false

jobs:
  giro:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Il PC di casa è acceso?
        id: pc
        # il PC manda un segnale di vita ogni minuto nel ramo "battito":
        # se è arrivato da meno di 10 minuti il bot gira sul PC e GitHub non fa nulla
        run: |
          ultimo=$(git show origin/battito:battito.txt 2>/dev/null | head -n 1 | tr -cd '0-9')
          silenzio=$(( $(date +%s) - ${ultimo:-0} ))
          # "0" = il PC è stato fermato a mano (Ctrl+C): GitHub subentra senza mandare l'avviso 🛟
          if [ "${ultimo:-}" = "0" ]; then echo "fermato_a_mano=1" >> "$GITHUB_OUTPUT"; fi
          if [ "$silenzio" -lt 600 ]; then
            echo "Il PC di casa è attivo (ultimo segnale $silenzio secondi fa): GitHub resta di riserva."
            echo "attivo=1" >> "$GITHUB_OUTPUT"
          else
            echo "Nessun segnale dal PC da $silenzio secondi: il bot gira su GitHub."
          fi

      - uses: actions/setup-python@v5
        if: steps.pc.outputs.attivo != '1'
        with:
          python-version: "3.12"

      - name: Installa librerie
        if: steps.pc.outputs.attivo != '1'
        run: pip install requests cryptography

      - name: Recupera i dati
        if: steps.pc.outputs.attivo != '1'
        # i dati (cifrati) stanno nel ramo "archivio"; "dati" è il vecchio ramo, usato solo per il passaggio
        run: |
          for ramo in archivio dati; do
            if git show origin/$ramo:data.json > /tmp/data.json 2>/dev/null; then
              mv /tmp/data.json data.json
              break
            fi
          done

      - name: Avvisa se GitHub prende il posto del PC
        if: steps.pc.outputs.attivo != '1' && steps.pc.outputs.fermato_a_mano != '1'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "$(git show origin/archivio:gestore.txt 2>/dev/null)" = "pc" ] && [ -n "$TELEGRAM_TOKEN" ]; then
            curl -s -o /dev/null "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=🛟 Il PC di casa non dà segni di vita da più di 10 minuti: il bot ora gira su GitHub."
          fi

      - name: Esegui il bot
        if: steps.pc.outputs.attivo != '1'
        env:
          REVX_API_KEY: ${{ secrets.REVX_API_KEY }}
          REVX_PRIVATE_KEY: ${{ secrets.REVX_PRIVATE_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
          SOLO_TEST: ${{ inputs.solo_test }}
          DURATA_GIRO: "240"         # resta attivo circa 4 minuti per avvio
          CONTROLLO_SECONDI: "45"    # controlla mercato e comandi ogni 45 secondi
        run: python bot.py

      - name: Salva i dati
        if: always() && steps.pc.outputs.attivo != '1'
        run: |
          [ -f data.json ] || exit 0
          cp data.json /tmp/data.json
          git config user.name "bot-crypto"
          git config user.email "bot-crypto@users.noreply.github.com"
          if git rev-parse --verify origin/archivio >/dev/null 2>&1; then
            git checkout -f -B archivio origin/archivio
          else
            git checkout -f --orphan archivio
            git rm -rf --cached . >/dev/null 2>&1 || true
          fi
          cp /tmp/data.json data.json
          echo github > gestore.txt
          git add data.json gestore.txt
          git commit -q -m "Aggiornamento dati" || true
          # il ramo tiene un solo commit (l'ultimo stato): così non si gonfia con migliaia di versioni
          git reset -q --soft "$(git commit-tree 'HEAD^{tree}' -m 'Aggiornamento dati')"
          git push -f origin archivio
